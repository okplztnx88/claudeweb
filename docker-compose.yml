version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: claudeweb-db
    environment:
      POSTGRES_USER: claudeweb
      POSTGRES_PASSWORD: claudeweb_dev_password
      POSTGRES_DB: claudeweb
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U claudeweb']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: claudeweb-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: claudeweb-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://claudeweb:claudeweb_dev_password@postgres:5432/claudeweb
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_secret_change_in_production
      PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app/apps/backend
      - /app/node_modules
    command: pnpm dev

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: claudeweb-frontend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    ports:
      - '3000:3000'
    depends_on:
      - backend
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - /app/node_modules
    command: pnpm dev

volumes:
  postgres-data:
  redis-data:
